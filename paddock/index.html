<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Paddock – Raja Dhanda</title>
  <meta name="description" content="A quiet corner for race weekends.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/favicons/apple-touch-icon.png">

  <!-- Theme Script (inline to prevent FOUC) -->
  <style id="theme-init">.theme-loading,.theme-loading *{transition:none!important}</style>
  <script>
    (function(){
      document.documentElement.classList.add('theme-loading');
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'midnight') {
        document.documentElement.setAttribute('data-theme', 'midnight');
      }
      // Set background immediately to prevent any flash
      document.documentElement.style.backgroundColor = savedTheme === 'midnight' ? '#0a0e27' : '#FFF8F0';
      // Remove loading class after first paint
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          document.documentElement.classList.remove('theme-loading');
          document.documentElement.style.backgroundColor = '';
        });
      });
    })();
  </script>

  <!-- Type -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Shared styles/scripts -->
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/site.js" defer></script>

  <style>
    /* Floating Elements */
    .floating-element{
      position:absolute; pointer-events:none; opacity:.08; color:var(--muted);
      font-size:14px; animation:float 15s ease-in-out infinite; z-index:1;
    }
    .floating-element:nth-child(1){top:15%; right:20%; animation-delay:-5s}
    .floating-element:nth-child(2){bottom:25%; left:15%; animation-delay:-10s; animation-duration:20s}
    .floating-element:nth-child(3){top:70%; right:30%; animation-delay:-15s; animation-duration:25s}

    @keyframes float{
      0%,100%{transform:translateY(0) rotate(0)}
      33%{transform:translateY(-15px) rotate(2deg)}
      66%{transform:translateY(8px) rotate(-1deg)}
    }

    /* Live timing frame */
    .timing-card{
      border:1px solid var(--border); border-radius:14px; overflow:hidden;
      background:rgba(255,255,255,.75); box-shadow:var(--shadow-soft); margin-top:20px;
    }
    [data-theme="midnight"] .timing-card{background:rgba(10,14,39,.6)}
    .timing-card iframe{display:block; width:100%; height:72vh; min-height:480px; border:0; background:#0b0b0f}
    .timing-note{color:var(--muted); font-size:.9rem; margin-top:12px}
    .timing-note a{color:inherit}
  </style>
</head>
<body class="subpage">
  <!-- Page Transition Overlay -->
  <div class="page-transition" id="pageTransition"></div>

  <!-- Theme Toggle Button -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle midnight mode">
    <svg class="icon icon-moon" aria-hidden="true"><use href="/assets/icons/sprite.svg#moon"/></svg>
    <svg class="icon icon-sun" aria-hidden="true"><use href="/assets/icons/sprite.svg#sun"/></svg>
  </button>

  <!-- Navigation -->
  <a href="/" class="nav-back" aria-label="Back to home">
    <svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#house"/></svg>
  </a>

  <!-- Floating Elements -->
  <div class="floating-element">✦</div>
  <div class="floating-element">◇</div>
  <div class="floating-element">◈</div>

  <main>
    <h1>The Paddock</h1>
    <p class="subtitle">you found the flag 🏁 — live F1 timing below</p>
    <section class="timing-card" aria-label="Live F1 timing">
      <iframe src="https://f1-dash.com/dashboard" loading="lazy" title="F1 live timing dashboard" allow="fullscreen"></iframe>
    </section>
    <p class="timing-note">Live timing via <a href="https://f1-dash.com" target="_blank" rel="noopener noreferrer">f1-dash</a>, an open-source real-time F1 telemetry dashboard. It lights up during practice, qualifying, and race sessions.</p>
  </main>
  <footer>© 2025 Raja Dhanda – Crafted with care</footer>
</body>
</html>
