<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects – Raja Dhanda</title>
  <meta name="description" content="Projects and experiments by Raja Dhanda - iOS apps, ML-driven tools, and more.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rajadhanda.me/projects/">
  <meta property="og:title" content="Projects – Raja Dhanda">
  <meta property="og:description" content="Projects and experiments by Raja Dhanda - iOS apps, ML-driven tools, and more.">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/favicons/apple-touch-icon.png">

  <!-- Theme Script (inline to prevent FOUC) -->
  <style id="theme-init">.theme-loading,.theme-loading *{transition:none!important}</style>
  <script>
    (function(){
      document.documentElement.classList.add('theme-loading');
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'midnight') {
        document.documentElement.setAttribute('data-theme', 'midnight');
      }
      // Set background immediately to prevent any flash
      document.documentElement.style.backgroundColor = savedTheme === 'midnight' ? '#0a0e27' : '#FFF8F0';
      // Remove loading class after first paint
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          document.documentElement.classList.remove('theme-loading');
          document.documentElement.style.backgroundColor = '';
        });
      });
    })();
  </script>

  <!-- Type -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Shared styles/scripts -->
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/site.js" defer></script>

  <style>
    /* Floating Elements */
    .floating-element{
      position:absolute; pointer-events:none; opacity:.08; color:var(--muted);
      font-size:14px; animation:float 15s ease-in-out infinite; z-index:1;
    }
    .floating-element:nth-child(1){top:15%; right:20%; animation-delay:-5s}
    .floating-element:nth-child(2){bottom:25%; left:15%; animation-delay:-10s; animation-duration:20s}
    .floating-element:nth-child(3){top:70%; right:30%; animation-delay:-15s; animation-duration:25s}

    @keyframes float{
      0%,100%{transform:translateY(0) rotate(0)}
      33%{transform:translateY(-15px) rotate(2deg)}
      66%{transform:translateY(8px) rotate(-1deg)}
    }

    /* Projects */
    .projects-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; margin-top:20px}
    .project-card{
      border:1px solid var(--border); border-radius:14px; padding:18px; background:rgba(255,255,255,.75);
      box-shadow:var(--shadow-soft); transition:transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
      position:relative; overflow:hidden;
      display:flex; flex-direction:column
    }
    [data-theme="midnight"] .project-card{background:rgba(10,14,39,.6)}
    .project-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-medium); border-color:var(--border-hover)}
    .project-desc{margin:0 0 14px; color:var(--muted)}
    @media (max-width:1024px){.projects-grid{grid-template-columns:repeat(2, 1fr)}}
    @media (max-width:640px){.projects-grid{grid-template-columns:1fr}}

    /* Hero project */
    .hero-project{
      grid-column:1 / -1;
      text-decoration:none; color:inherit; cursor:pointer;
    }
    .hero-project:hover .eyesoff-mark{transform:scale(1.06)}
    .hero-project-head{display:flex; align-items:center; gap:10px; margin-bottom:6px}
    .eyesoff-mark{width:30px; height:30px; flex:none; transition:transform .25s var(--ease)}
    .eyesoff-mark svg{width:100%; height:100%; overflow:visible}
    .eo-eye{fill:#fff; stroke:#0c0c11; stroke-width:2.2}
    .eo-iris-rim{fill:#4c371a}
    .eo-iris-gold{fill:#a57939}
    .eo-pupil{fill:#181008}
    .eo-ring{fill:none; stroke:#ff3131; stroke-width:3}
    .eo-slash{stroke:#ff3131; stroke-width:3; stroke-linecap:round}
    .eo-eyes,.eo-pupils,.eo-ring{transform-box:view-box}
    .eo-eyes{transform-origin:24px 24px; animation:eo-blink 6s var(--ease) infinite}
    .eo-pupils{transform-origin:24px 24px; animation:eo-glance 6s var(--ease) infinite}
    .eo-ring{transform-origin:24px 24px; opacity:0; transform:scale(.6); animation:eo-ring-in 6s var(--ease) infinite}
    .eo-slash{stroke-dasharray:44; stroke-dashoffset:44; opacity:0; animation:eo-slash-draw 6s var(--ease) infinite}
    @keyframes eo-blink{0%,32%,50%,to{transform:scaleY(1)} 41%{transform:scaleY(.06)}}
    @keyframes eo-glance{0%,8%{transform:translate(-2.6px)} 18%,26%{transform:translate(2.6px)} 34%,to{transform:translate(0)}}
    @keyframes eo-ring-in{0%,30%{opacity:0; transform:scale(.6)} 40%,93%{opacity:1; transform:scale(1)} to{opacity:0; transform:scale(1)}}
    @keyframes eo-slash-draw{0%,30%{stroke-dashoffset:44; opacity:0} 37%{opacity:1} 45%,93%{stroke-dashoffset:0; opacity:1} to{stroke-dashoffset:0; opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .eo-eyes,.eo-pupils,.eo-ring,.eo-slash{animation:none !important}
      .eo-ring{opacity:1; transform:none}
      .eo-slash{stroke-dashoffset:0; opacity:1}
    }
    .hero-project-title{margin:0; font-weight:600; font-size:1.1rem}
    .hero-project-link{
      display:inline-flex; align-items:center; gap:6px; font-size:.85rem; color:var(--muted);
      margin-top:auto; align-self:flex-start;
      transition:color .18s var(--ease)
    }
    .hero-project:hover .hero-project-link{color:var(--fg)}
  </style>
</head>
<body class="subpage">
  <!-- Work in Progress Bar -->
  <div class="wip-bar" aria-hidden="true"></div>
  <div class="wip-label" aria-hidden="true">work in progress...</div>

  <!-- Page Transition Overlay -->
  <div class="page-transition" id="pageTransition"></div>

  <!-- Theme Toggle Button -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle midnight mode">
    <svg class="icon icon-moon" aria-hidden="true"><use href="/assets/icons/sprite.svg?v=2#moon"/></svg>
    <svg class="icon icon-sun" aria-hidden="true"><use href="/assets/icons/sprite.svg?v=2#sun"/></svg>
  </button>

  <!-- Navigation -->
  <a href="/" class="nav-back" aria-label="Back to home">
    <svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg?v=2#house"/></svg>
  </a>

  <!-- Floating Elements -->
  <div class="floating-element">✦</div>
  <div class="floating-element">◇</div>
  <div class="floating-element">◈</div>

  <main>
    <h1>Projects</h1>
    <p class="subtitle">things I've tried</p>
    <section class="projects-grid" aria-label="Projects">
      <a class="project-card hero-project" href="https://eyesoff.app" target="_blank" rel="noopener noreferrer" aria-label="EyesOff – visit eyesoff.app">
        <div class="hero-project-head">
          <span class="eyesoff-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <g class="eo-eyes">
                <ellipse class="eo-eye" cx="14.5" cy="24" rx="8.5" ry="14.5"></ellipse>
                <ellipse class="eo-eye" cx="33.5" cy="24" rx="8.5" ry="14.5"></ellipse>
                <g class="eo-pupils">
                  <g class="eo-iris" transform="translate(14.5 24)">
                    <circle class="eo-iris-rim" r="4.6"></circle>
                    <circle class="eo-iris-gold" r="4"></circle>
                    <circle class="eo-pupil" r="2"></circle>
                  </g>
                  <g class="eo-iris" transform="translate(33.5 24)">
                    <circle class="eo-iris-rim" r="4.6"></circle>
                    <circle class="eo-iris-gold" r="4"></circle>
                    <circle class="eo-pupil" r="2"></circle>
                  </g>
                </g>
              </g>
              <circle class="eo-ring" cx="24" cy="24" r="22"></circle>
              <line class="eo-slash" x1="9" y1="9" x2="39" y2="39"></line>
            </svg>
          </span>
          <h2 class="hero-project-title">EyesOff</h2>
        </div>
        <p class="project-desc">On-device AI that alerts you the instant a stranger's eyes hit your screen. Build for MacOS and Windows.</p>
        <span class="hero-project-link">eyesoff.app ↗</span>
      </a>
    </section>
  </main>
  <footer>© 2026 Raja Dhanda – Crafted with care</footer>
</body>
</html>
