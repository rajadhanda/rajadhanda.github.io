<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog – Raja Dhanda</title>
  <meta name="description" content="Notes and thought experiments from Raja Dhanda on technology, fintech, and more.">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rajadhanda.me/blog/">
  <meta property="og:title" content="Blog – Raja Dhanda">
  <meta property="og:description" content="Notes and thought experiments from Raja Dhanda on technology, fintech, and more.">
  
  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/favicons/apple-touch-icon.png">

  <!-- Theme Script (inline to prevent FOUC) -->
  <style id="theme-init">.theme-loading,.theme-loading *{transition:none!important}</style>
  <script>
    (function(){
      document.documentElement.classList.add('theme-loading');
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'midnight') {
        document.documentElement.setAttribute('data-theme', 'midnight');
      }
      document.documentElement.style.backgroundColor = savedTheme === 'midnight' ? '#0a0e27' : '#FFF8F0';
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          document.documentElement.classList.remove('theme-loading');
          document.documentElement.style.backgroundColor = '';
        });
      });
    })();
  </script>

  <!-- Type -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer"/>

  <!-- Smooth Scroll -->
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>

  <style>
    :root{
      --bg:#FFF8F0; --fg:#0A2540; --fg-light:#2A4A60; --muted:#5A7A90;
      --accent:#2CA58D; --accent-soft:#E8F8F5;
      --border:#e8e8e8; --border-hover:#d4d4d4;
      --maxw:880px; --menu-w:420px;
      --ease:cubic-bezier(.16,1,.3,1);
      --ease-back:cubic-bezier(.34,1.56,.64,1);
      --shadow-soft:0 2px 20px rgba(0,0,0,.06);
      --shadow-medium:0 8px 30px rgba(0,0,0,.12);
      
      --blog-bg:var(--bg); --blog-card-bg:rgba(255,255,255,0.9);
      --blog-accent:var(--accent); --blog-text:var(--fg);
      --blog-meta:var(--muted); --blog-border:var(--border);
    }
    
    [data-theme="midnight"]{
      --bg:#0a0e27; --fg:#E8ECF4; --fg-light:#b8c5d9; --muted:#7a8ca8;
      --accent:#00A896; --accent-soft:#141b33;
      --border:#1a2340; --border-hover:#243155;
      --shadow-soft:0 2px 20px rgba(0,0,0,.3);
      --shadow-medium:0 8px 30px rgba(0,0,0,.5);
      
      --blog-bg:#0f1524; --blog-card-bg:rgba(26,30,47,0.6);
      --blog-accent:var(--accent); --blog-text:var(--fg);
      --blog-meta:var(--muted); --blog-border:rgba(0,168,150,0.2);
    }
    
    body{ transition:background-color 0.5s var(--ease), color 0.5s var(--ease); }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:'Crimson Text',serif; background:var(--blog-bg); color:var(--fg);
      line-height:1.6; overflow-x:hidden;
    }

    /* ── Nav ── */
    .nav-back{
      position:fixed; top:28px; left:28px; width:52px; height:52px; border-radius:50%;
      border:1px solid var(--blog-border); display:grid; place-items:center;
      background:rgba(255,255,255,.9); backdrop-filter:blur(12px);
      cursor:pointer; transition:all .3s var(--ease); z-index:1001; box-shadow:var(--shadow-soft);
      text-decoration:none; color:var(--fg);
    }
    .nav-back:hover{transform:scale(1.05) translateY(-1px); border-color:var(--border-hover); box-shadow:var(--shadow-medium)}
    .nav-back i{font-size:18px; transition:transform .4s var(--ease-back);}
    .nav-back:hover i{transform:rotate(15deg)}
    [data-theme="midnight"] .nav-back{background:rgba(26,30,47,.92);}
    
    .theme-toggle{
      position:fixed; top:28px; right:28px; width:52px; height:52px; border-radius:50%;
      border:1px solid var(--blog-border); display:grid; place-items:center;
      background:rgba(255,255,255,.9); backdrop-filter:blur(12px);
      cursor:pointer; transition:all .3s var(--ease); z-index:1001; box-shadow:var(--shadow-soft);
    }
    [data-theme="midnight"] .theme-toggle{background:rgba(26,30,47,.92);}
    .theme-toggle:hover{transform:scale(1.05) translateY(-1px); border-color:var(--border-hover); box-shadow:var(--shadow-medium);}
    .theme-toggle i{font-size:18px; color:var(--fg); transition:transform .4s var(--ease-back);}
    .theme-toggle:hover i{transform:rotate(15deg);}
    .theme-toggle .fa-moon{opacity:1}
    .theme-toggle .fa-sun{opacity:0; position:absolute}
    [data-theme="midnight"] .theme-toggle .fa-moon{opacity:0}
    [data-theme="midnight"] .theme-toggle .fa-sun{opacity:1}

    @media (max-width:768px){
      .nav-back{top:28px; left:20px; width:46px; height:46px}
      .theme-toggle{top:28px; right:20px; width:46px; height:46px}
    }
    @media (max-width:480px){
      .nav-back{top:28px; left:16px; width:42px; height:42px}
      .theme-toggle{top:28px; right:16px; width:42px; height:42px}
    }
    
    button,.nav-back{ transition:transform 0.15s var(--ease), box-shadow 0.15s var(--ease); }
    button:active,.nav-back:active{transform:scale(0.97) translateY(1px);}
    @media (prefers-reduced-motion: reduce){ button:active,.nav-back:active{transform:none} }

    /* ── Page titles ── */
    h1{
      font-family:'Playfair Display',serif;
      font-weight:400; font-size:clamp(1.5rem,4vw,2.5rem); margin:0 0 8px;
      letter-spacing:-.01em; padding-top:80px;
    }
    .subtitle{
      color:var(--muted); font-style:italic; margin-bottom:52px; font-size:1.1rem;
    }

    main{ max-width:1200px; width:100%; margin:0 auto; padding:48px 20px 20px; }
    .blog-container{ margin-bottom:80px; }

    /* ── Long-form post cards ── */
    .blog-grid{
      display:grid; grid-template-columns:repeat(auto-fit, minmax(380px, 1fr));
      gap:32px;
    }
    .blog-card{
      background:var(--blog-card-bg); border:1px solid var(--blog-border);
      border-radius:14px; padding:36px; transition:all .4s var(--ease);
      backdrop-filter:blur(20px); position:relative; overflow:hidden;
      opacity:0; transform:translateY(30px);
      animation:slideInUp 0.6s var(--ease) forwards;
      cursor:pointer; text-decoration:none; color:inherit;
      transform-style:preserve-3d; perspective:1000px; will-change:transform;
    }
    .blog-card:nth-child(1){animation-delay:0.1s}
    .blog-card:nth-child(2){animation-delay:0.2s}
    .blog-card:nth-child(3){animation-delay:0.3s}
    .blog-card::before{
      content:''; position:absolute; top:0; left:0; right:0; height:4px;
      background:var(--accent); transform:scaleX(0); transition:transform .4s var(--ease);
    }
    .blog-card:hover::before{transform:scaleX(1)}
    .blog-card:hover{
      transform:translateY(-8px); box-shadow:0 20px 40px rgba(0,0,0,.1);
      border-color:var(--border-hover);
    }
    @media (hover:hover) and (pointer:fine){
      .blog-card.tilt{transition:transform 0.3s var(--ease), box-shadow 0.4s var(--ease);}
    }
    @media (hover:none) or (pointer:coarse){
      .blog-card:active{transform:translateY(-4px); transition:transform 0.2s var(--ease);}
    }
    @media (prefers-reduced-motion:reduce){ .blog-card{transform-style:flat; perspective:none} }

    .article-title-section{
      display:flex; align-items:flex-start; justify-content:space-between;
      margin-bottom:20px; gap:20px; overflow:hidden;
    }
    .blog-card h3{
      font-size:1.6rem; font-weight:600; margin:0; color:var(--blog-text);
      line-height:1.3; transition:color .3s var(--ease);
      flex:1; letter-spacing:-0.01em; min-width:0;
      display:-webkit-box; -webkit-line-clamp:2; line-clamp:2;
      -webkit-box-orient:vertical; overflow:hidden; word-break:break-word;
    }
    .blog-card:hover h3{color:var(--blog-accent)}
    .blog-card .excerpt{
      color:var(--fg-light); font-size:1rem; line-height:1.5; margin:0;
    }
    .blog-meta{
      display:flex; align-items:center; gap:20px; margin-bottom:24px;
      font-size:0.95rem; color:var(--blog-meta); flex-wrap:wrap;
    }
    .blog-meta .date,.blog-meta .read-time{display:flex; align-items:center; gap:8px}
    .blog-meta i{font-size:14px; opacity:0.8;}

    .tag{
      background:var(--accent-soft); color:var(--accent);
      padding:4px 12px; border-radius:20px; font-size:0.8rem; font-weight:500;
      transition:all .3s var(--ease); display:inline-block;
      position:relative; overflow:hidden;
    }
    .tag::before{
      content:''; position:absolute; inset:0; background:var(--accent);
      transform:scaleX(0); transform-origin:left; transition:transform .3s var(--ease);
      z-index:-1; border-radius:20px;
    }
    @media (hover:hover) and (pointer:fine){
      .tag:hover{color:white; transform:translateY(-2px);}
      .tag:hover::before{transform:scaleX(1)}
    }

    /* ── Notes section ── */
    .section-header{
      display:flex; align-items:baseline; justify-content:space-between;
      margin:72px 0 28px; padding-bottom:14px;
      border-bottom:1px solid var(--blog-border);
    }
    .section-title{
      font-family:'Playfair Display',serif; font-size:1.5rem;
      font-weight:400; margin:0; letter-spacing:-0.01em;
    }
    .section-link{
      font-family:'Inter',sans-serif; font-size:0.78rem;
      color:var(--muted); text-decoration:none;
      display:inline-flex; align-items:center; gap:5px;
      transition:color 0.3s var(--ease);
    }
    .section-link:hover{color:var(--accent);}

    .notes-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:18px;
    }
    @media (max-width:900px){ .notes-grid{grid-template-columns:repeat(2,1fr);} }
    @media (max-width:560px){ .notes-grid{grid-template-columns:1fr;} }

    .note-card{
      background:var(--blog-card-bg); border:1px solid var(--blog-border);
      border-radius:12px; padding:22px 24px;
      display:flex; flex-direction:column; gap:10px;
      text-decoration:none; color:inherit; cursor:pointer;
      transition:all 0.3s var(--ease);
      opacity:0; animation:slideInUp 0.5s var(--ease) forwards;
      position:relative; overflow:hidden;
    }
    .note-card::before{
      content:''; position:absolute; top:0; left:0; right:0; height:3px;
      background:var(--accent); transform:scaleX(0); transition:transform 0.3s var(--ease);
    }
    .note-card:hover::before{transform:scaleX(1);}
    .note-card:hover{
      transform:translateY(-4px);
      box-shadow:0 12px 28px rgba(0,0,0,.08);
      border-color:var(--border-hover);
    }
    @media (hover:none) or (pointer:coarse){
      .note-card:active{transform:translateY(-2px);}
    }

    .note-date{
      font-family:'Inter',sans-serif; font-size:0.7rem;
      color:var(--muted); letter-spacing:0.04em; text-transform:uppercase;
    }
    .note-body{
      font-size:0.95rem; line-height:1.65; color:var(--fg-light); flex:1;
      display:-webkit-box; -webkit-line-clamp:6; line-clamp:6;
      -webkit-box-orient:vertical; overflow:hidden;
    }
    .note-footer{
      display:inline-flex; align-items:center; gap:5px;
      font-family:'Inter',sans-serif; font-size:0.72rem;
      color:var(--accent); opacity:0; transition:opacity 0.3s var(--ease);
    }
    .note-card:hover .note-footer{opacity:1;}
    .note-footer svg{width:11px; height:11px; flex-shrink:0;}

    /* ── Subscribe CTA ── */
    .substack-cta{display:flex; justify-content:center; margin-top:64px;}
    .substack-btn{
      display:inline-flex; align-items:center; gap:10px;
      padding:13px 28px; background:var(--accent); color:#fff;
      border-radius:100px; text-decoration:none;
      font-family:'Inter',sans-serif; font-size:0.88rem; font-weight:500;
      letter-spacing:0.02em; transition:all 0.3s var(--ease);
      box-shadow:0 4px 18px rgba(44,165,141,0.28);
    }
    .substack-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 28px rgba(44,165,141,0.38);
      filter:brightness(1.08);
    }
    .substack-btn svg{width:15px; height:15px; flex-shrink:0;}

    /* ── Floating / ambient ── */
    .floating-element{
      position:absolute; pointer-events:none; opacity:.1; color:var(--accent);
      font-size:16px; animation:float 12s ease-in-out infinite; z-index:1;
    }
    .floating-element:nth-child(1){top:20%; right:15%; animation-delay:-3s}
    .floating-element:nth-child(2){bottom:30%; left:10%; animation-delay:-8s; animation-duration:15s}
    .floating-element:nth-child(3){top:60%; right:25%; animation-delay:-12s; animation-duration:18s}

    @keyframes slideInUp{
      from{opacity:0; transform:translateY(30px)}
      to{opacity:1; transform:translateY(0)}
    }
    @keyframes float{
      0%,100%{transform:translateY(0) rotate(0)}
      33%{transform:translateY(-12px) rotate(3deg)}
      66%{transform:translateY(6px) rotate(-2deg)}
    }

    /* ── Layout breakpoints ── */
    @media (max-width:1024px){main{padding:80px 20px 20px} h1{padding-top:70px}}
    @media (max-width:900px){
      .article-title-section{flex-direction:column; align-items:flex-start; gap:16px}
    }
    @media (max-width:768px){
      .blog-grid{grid-template-columns:1fr; gap:24px}
      .blog-card{padding:28px}
      .blog-card h3{font-size:1.4rem}
      main{padding:80px 20px 20px}
      h1{font-size:clamp(1.4rem,5vw,2rem); padding-top:66px}
    }
    @media (max-width:560px){
      main{padding:72px 20px 20px}
      h1{font-size:clamp(1.3rem,5vw,1.8rem); padding-top:66px}
      .subtitle{font-size:1rem; margin-bottom:36px}
    }
    @media (max-width:480px){
      main{padding:68px 16px 20px}
      h1{font-size:1.5rem; padding-top:62px}
    }

    /* ── System chrome ── */
    .page-transition{
      position:fixed; inset:0; background:var(--blog-bg);
      opacity:0; pointer-events:none; z-index:1500;
      transition:opacity 0.4s var(--ease);
    }
    .page-transition.active{opacity:1; pointer-events:all;}
    @media (prefers-reduced-motion:reduce){.page-transition{display:none}}
    
    .wip-bar{
      position:fixed; top:0; left:0; right:0; height:14px; z-index:2000;
      background:repeating-linear-gradient(-45deg,#f5c842,#f5c842 10px,#1a1a1a 10px,#1a1a1a 20px);
      background-size:28.28px 100%; animation:wip-scroll 0.5s linear infinite;
    }
    [data-theme="midnight"] .wip-bar{
      background:repeating-linear-gradient(-45deg,#d4a72c,#d4a72c 10px,#0a0e27 10px,#0a0e27 20px);
      background-size:28.28px 100%;
    }
    @keyframes wip-scroll{0%{background-position:0 0} 100%{background-position:28.28px 0}}
    .wip-label{
      position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:2001;
      font-family:'Inter',sans-serif; font-size:11px; font-weight:400; letter-spacing:0.08em;
      text-transform:lowercase; color:var(--muted); white-space:nowrap; font-style:italic;
    }
    @media (prefers-reduced-motion:reduce){.wip-bar{animation:none}}
    footer{padding:24px; text-align:center; color:var(--muted); font-size:.7rem; margin-top:40px;}
  </style>
</head>
<body>
  <div class="wip-bar" aria-hidden="true"></div>
  <div class="wip-label" aria-hidden="true">work in progress...</div>
  <div class="page-transition" id="pageTransition"></div>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle midnight mode">
    <i class="fa-solid fa-moon" aria-hidden="true"></i>
    <i class="fa-solid fa-sun" aria-hidden="true"></i>
  </button>

  <a href="/" class="nav-back" aria-label="Back to home">
    <i class="fa-solid fa-house" aria-hidden="true"></i>
  </a>

  <div class="floating-element">✦</div>
  <div class="floating-element">◇</div>
  <div class="floating-element">◈</div>

  <main>
    <h1>Blog</h1>
    <p class="subtitle">notes and thought experiments</p>

    <div class="blog-container">

      <!-- Long-form posts -->
      <div class="blog-grid" id="blog-grid">
        <a href="/blog/this-website-was-vibe-coded.html" class="blog-card">
          <div class="blog-meta">
            <span class="date"><i class="fa-solid fa-calendar" aria-hidden="true"></i> Nov 23, 2025</span>
            <span class="read-time"><i class="fa-solid fa-clock" aria-hidden="true"></i> ~3 min read</span>
          </div>
          <div class="article-title-section">
            <h3>This website was vibe coded</h3>
          </div>
          <p class="excerpt">Vibe coding is everywhere....but I still think it's underrated</p>
        </a>
      </div>

      <!-- Notes grid — revealed by JS when notes are available -->
      <div id="notes-section" style="display:none">
        <div class="section-header">
          <h2 class="section-title">Notes</h2>
          <a href="https://substack.com/@rajadhanda" target="_blank" rel="noopener" class="section-link">
            from Substack
            <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:9px;" aria-hidden="true"></i>
          </a>
        </div>
        <div class="notes-grid" id="notes-grid"></div>
      </div>

      <!-- Subscribe CTA -->
      <div class="substack-cta">
        <a href="https://substack.com/@rajadhanda" target="_blank" rel="noopener" class="substack-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z"/>
          </svg>
          Subscribe on Substack
        </a>
      </div>

    </div>
  </main>

  <footer>© 2025 Raja Dhanda – Crafted with care</footer>

  <script>
    // ── Theme toggle ──
    (function(){
      const btn = document.getElementById('themeToggle');
      const html = document.documentElement;
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (html.getAttribute('data-theme') === 'midnight') {
          html.removeAttribute('data-theme');
          localStorage.setItem('theme', 'light');
        } else {
          html.setAttribute('data-theme', 'midnight');
          localStorage.setItem('theme', 'midnight');
        }
      });
    })();

    // ── Lenis smooth scroll ──
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let lenis = null;
    if (!reducedMotion) {
      lenis = new Lenis({
        duration: 1.2,
        easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        orientation: 'vertical',
        smoothWheel: true
      });
      (function raf(t){ lenis.raf(t); requestAnimationFrame(raf); })(0);
      lenis.on('scroll', ({ scroll }) => {
        document.querySelectorAll('.floating-element').forEach((el, i) => {
          el.style.transform = `translateY(${scroll * (i + 1) * 0.3}px)`;
        });
      });
    }

    // ── Shared helpers ──
    function escHtml(s) {
      return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function stripHtml(html) {
      const d = document.createElement('div');
      d.innerHTML = html || '';
      return d.textContent || d.innerText || '';
    }
    function fmtDate(s) {
      try {
        return new Date(s).toLocaleDateString('en-GB', {
          day:'numeric', month:'short', year:'numeric'
        });
      } catch(_){ return String(s||'').slice(0,10); }
    }
    function sig(ms) {
      return typeof AbortSignal.timeout === 'function'
        ? AbortSignal.timeout(ms) : undefined;
    }

    // ── 3D tilt for long-form blog cards ──
    function attachTilt(cards) {
      const hasHover = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
      cards.forEach(card => {
        if (hasHover && !reducedMotion) {
          card.classList.add('tilt');
          card.addEventListener('mousemove', e => {
            const r = card.getBoundingClientRect();
            const rx = ((e.clientY - r.top)  - r.height / 2) / 20;
            const ry = (r.width / 2 - (e.clientX - r.left)) / 20;
            card.style.transform = `translateY(-8px) perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          });
          card.addEventListener('mouseleave', () => {
            card.style.transform = 'translateY(0) perspective(1000px) rotateX(0) rotateY(0)';
          });
        } else {
          card.addEventListener('mouseenter', () => { card.style.transform = 'translateY(-8px)'; });
          card.addEventListener('mouseleave', () => { card.style.transform = 'translateY(0)'; });
        }
      });
    }

    // ── Notes: try Substack profile feed via rss2json, then notes.json ──

    async function fetchNotesRSS() {
      // Try Substack's own profile feed URLs — no &count param, free tier rejects it
      const feedUrls = [
        'https://substack.com/@rajadhanda/feed',
        'https://rajadhanda.substack.com/feed'
      ];
      for (const feedUrl of feedUrls) {
        try {
          const s = sig(8000);
          const res = await fetch(
            `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`,
            s ? { signal: s } : {}
          );
          if (!res.ok) continue;
          const data = await res.json();
          if (data.status !== 'ok' || !data.items?.length) continue;
          return data.items.map(item => ({
            text: stripHtml(item.description || item.content || '').trim(),
            date: item.pubDate || '',
            link: item.link || 'https://substack.com/@rajadhanda'
          }));
        } catch(_) { /* try next */ }
      }
      return null;
    }

    async function fetchNotesJSON() {
      const s = sig(5000);
      const res = await fetch('/blog/notes.json', s ? { signal: s } : {});
      if (!res.ok) return null;
      const arr = await res.json();
      return Array.isArray(arr) && arr.length ? arr : null;
    }

    function renderNoteCard(note, index) {
      const a = document.createElement('a');
      a.href = note.link || 'https://substack.com/@rajadhanda';
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'note-card';
      a.style.animationDelay = `${0.05 + index * 0.06}s`;

      const body = note.text || '';
      const display = body.length > 340 ? body.slice(0, 337) + '…' : body;

      a.innerHTML = `
        ${note.date ? `<div class="note-date">${escHtml(fmtDate(note.date))}</div>` : ''}
        <p class="note-body">${escHtml(display)}</p>
        <div class="note-footer" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z"/>
          </svg>
          <span>View note</span>
        </div>
      `;
      return a;
    }

    async function initNotes() {
      const section = document.getElementById('notes-section');
      const grid    = document.getElementById('notes-grid');
      if (!section || !grid) return;

      let notes = null;
      try { notes = await fetchNotesRSS(); } catch(_) {}
      if (!notes) {
        try { notes = await fetchNotesJSON(); } catch(_) {}
      }
      if (!notes || !notes.length) return;

      notes.forEach((note, i) => grid.appendChild(renderNoteCard(note, i)));
      section.style.display = '';
    }

    // ── Init ──
    document.addEventListener('DOMContentLoaded', () => {
      attachTilt(document.querySelectorAll('.blog-card'));
      initNotes();
    });

    // ── Page transition ──
    (function(){
      const overlay = document.getElementById('pageTransition');
      function reset() {
        if (!overlay) return;
        overlay.classList.remove('active');
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none';
        document.body.style.overflow = '';
      }
      reset();
      window.addEventListener('pageshow', e => { if (e.persisted) reset(); });
      if (!overlay || reducedMotion) return;

      document.querySelectorAll('a[href^="/"], a[href^="./"], a.nav-back').forEach(link => {
        link.addEventListener('click', function(e) {
          const href = this.getAttribute('href');
          if (!href || href === '#' || /^(mailto|tel):/.test(href)) return;
          try {
            const u = new URL(href, window.location.origin);
            if (u.hostname && u.hostname !== window.location.hostname) return;
          } catch(_) {}
          e.preventDefault();
          overlay.classList.add('active');
          setTimeout(() => window.location.assign(href), 300);
        });
      });
    })();
  </script>
</body>
</html>
