name: Validate Substack Notes

on:
  push:
    branches: [main]
    paths:
      - blog/notes.json
      - scripts/*substack_notes.py
      - tests/test_substack_sync.py
      - .github/workflows/sync-substack-notes.yml
  pull_request:
    paths:
      - blog/notes.json
      - scripts/*substack_notes.py
      - tests/test_substack_sync.py
      - .github/workflows/sync-substack-notes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test note parsing and cache preservation
        run: python3 -m unittest discover -s tests -p test_substack_sync.py
      - name: Check the published cache shape
        run: |
          python3 - <<'PY'
          from datetime import date
          from pathlib import Path
          from urllib.parse import urlsplit
          import json

          notes = json.loads(Path("blog/notes.json").read_text())
          assert isinstance(notes, list) and notes, "Expected a nonempty list of notes"
          for note in notes:
              assert isinstance(note["text"], str) and note["text"].strip()
              assert date.fromisoformat(note["date"]).isoformat() == note["date"]
              url = urlsplit(note["link"])
              assert url.scheme == "https" and (
                  url.hostname == "substack.com" or (url.hostname or "").endswith(".substack.com")
              )
          PY
